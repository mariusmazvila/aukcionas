# Netlify deploy konfigūracija
# Dokumentacija: https://docs.netlify.com/configure-builds/file-based-configuration/

[build]
  command   = "npm run build"
  publish   = "dist"

[build.environment]
  NODE_VERSION = "20"

# ---------- Saugumo antraštės ----------

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options             = "DENY"
    X-Content-Type-Options      = "nosniff"
    Referrer-Policy             = "strict-origin-when-cross-origin"
    Permissions-Policy          = "camera=(), microphone=(), geolocation=()"

# Astro generuoja hash'intus failus /_astro/* — galima cache'uoti visam laikui
[[headers]]
  for = "/_astro/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/fonts/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# ---------- Nukreipimai ----------

# Angliškas thank-you URL → lietuviškas (jei klientas dalindavosi senu URL)
[[redirects]]
  from   = "/thank-you"
  to     = "/aciu"
  status = 301
  force  = false
